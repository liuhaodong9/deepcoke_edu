# DeepCoke 教育版 — nginx 反代配置
#
# 部署位置: /etc/nginx/sites-available/deepcoke
# 启用:     ln -s /etc/nginx/sites-available/deepcoke /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
#
# 假设:
# - 前端 npm run build 出的产物放在 /var/www/deepcoke/dist
# - 文本后端跑在 127.0.0.1:8000
# - 语音后端跑在 127.0.0.1:8001
# - vLLM 跑在 127.0.0.1:11434（不出公网，仅后端访问）
#
# HTTPS 准备好后，把 server { listen 80; ... } 改成 443 + ssl_certificate

# 限流：每个 IP 每分钟最多 30 次 /chat/ 请求，防 GPU 被滥用
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=30r/m;
# 整体 API 限流：每个 IP 每秒 10 次（粗粒度防护）
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    # 改成你的域名或公网 IP（用 IP 时浏览器会警告 HTTPS）
    server_name 1.116.164.66;

    # 总请求体上限（PDF 上传等场景；目前接口不需要大体积）
    client_max_body_size 50M;

    # 流式响应必备
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # ── 前端静态文件 ────────────────────────────────────────────
    root /var/www/deepcoke/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 文本后端反代 ────────────────────────────────────────────
    # 因为前端 vue.config.js BACKEND_PATHS 列出了所有后端前缀，
    # 这里照同样的清单逐一 location 转发，避免误匹配静态资源
    location /login         { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /register      { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /logout        { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }

    location /chat          {
        limit_req zone=chat_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/deepcoke_proxy.conf;
    }
    location /new_session   { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /user_sessions { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /messages      { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /sessions      { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /folders       { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /rename_session { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /delete_session { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /face          { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /all_coals_page { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /papers        { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /chunk         { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }
    location /paper_graph   { proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/deepcoke_proxy.conf; }

    # ── 语音后端反代（WebSocket） ───────────────────────────────
    location /voice/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;  # WebSocket 长连接
    }

    # ── 日志 ────────────────────────────────────────────────────
    access_log /var/log/nginx/deepcoke_access.log;
    error_log  /var/log/nginx/deepcoke_error.log;
}
